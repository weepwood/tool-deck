name: Publish Preview Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.existing.outputs.exists != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        if: steps.existing.outputs.exists != 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        if: steps.existing.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify and package
        if: steps.existing.outputs.exists != 'true'
        run: |
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ToolDeck-${{ steps.version.outputs.tag }}-preview.apk"
          sha256sum "dist/ToolDeck-${{ steps.version.outputs.tag }}-preview.apk" > "dist/ToolDeck-${{ steps.version.outputs.tag }}-preview.apk.sha256"

      - name: Create GitHub prerelease
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/ToolDeck-$TAG-preview.apk#ToolDeck $TAG 预览版 APK" \
            "dist/ToolDeck-$TAG-preview.apk.sha256#SHA-256 校验文件" \
            --target "$GITHUB_SHA" \
            --title "ToolDeck $TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
