name: Bootstrap ToolDeck source

on:
  push:
    branches: [feature/initial-mvp]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: feature/initial-mvp
          fetch-depth: 0

      - name: Extract source archive
        run: |
          tar -xzf .tooldeck-bootstrap.tar.gz
          rm -f .tooldeck-bootstrap.tar.gz
          rm -f .github/workflows/bootstrap.yml

      - name: Commit generated source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 实现 ToolDeck 安卓原生工具中心"
          git push origin HEAD:feature/initial-mvp
